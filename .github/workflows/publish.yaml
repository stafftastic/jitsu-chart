name: Publish Helm chart
on:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: nix develop -c bash --noprofile --norc -eo pipefail {0}

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      - name: Package the chart built by the flake with the release version
        run: |
          mkdir unpacked dist
          tar -xzf "$(nix build -L --no-link --print-out-paths .#jitsu-chart)/jitsu-0.0.0.tgz" -C unpacked
          helm package unpacked/jitsu --version "${GITHUB_REF_NAME#v}" --destination dist
      - name: Log in to Docker Hub
        env:
          DOCKER_HUB_TOKEN: ${{secrets.DOCKER_HUB_TOKEN}}
        run: printf '%s' "$DOCKER_HUB_TOKEN" | helm registry login registry-1.docker.io --username stafftasticpush --password-stdin
      - name: Push the chart
        run: helm push dist/jitsu-*.tgz oci://registry-1.docker.io/stafftasticcharts
