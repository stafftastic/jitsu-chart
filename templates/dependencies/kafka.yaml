{{- define "jitsu.kafka.container" -}}
ports:
  - name: kafka
    containerPort: 9092
  - name: controller
    containerPort: 9093
env:
  - name: CLUSTER_ID
    value: {{ .Values.kafka.clusterId | quote }}
  - name: KAFKA_NODE_ID
    value: "1"
  - name: KAFKA_PROCESS_ROLES
    value: "broker,controller"
  - name: KAFKA_LISTENERS
    value: "PLAINTEXT://:9092,CONTROLLER://:9093"
  - name: KAFKA_ADVERTISED_LISTENERS
    value: {{ printf "PLAINTEXT://%s-kafka:9092" (include "jitsu.fullname" .) | quote }}
  - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
    value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
  - name: KAFKA_CONTROLLER_LISTENER_NAMES
    value: "CONTROLLER"
  - name: KAFKA_INTER_BROKER_LISTENER_NAME
    value: "PLAINTEXT"
  - name: KAFKA_CONTROLLER_QUORUM_VOTERS
    value: "1@localhost:9093"
  - name: KAFKA_LOG_DIRS
    value: "/var/lib/kafka/data"
  - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
    value: "1"
  - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
    value: "1"
  - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
    value: "1"
  - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
    value: "1"
  - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR
    value: "1"
readinessProbe:
  tcpSocket:
    port: kafka
livenessProbe:
  tcpSocket:
    port: kafka
  initialDelaySeconds: 60
{{- end }}

{{- if .Values.kafka.enabled }}
{{- $ctx := dict
  "root" .
  "name" (printf "%s-kafka" (include "jitsu.fullname" .))
  "component" "kafka"
  "values" .Values.kafka
  "mountPath" "/var/lib/kafka"
  "container" (include "jitsu.kafka.container" .)
  "ports" (dict "kafka" 9092)
  "podSecurityContext" (dict "fsGroup" 1000)
}}
{{ include "jitsu.dependency.service" $ctx }}
---
{{ include "jitsu.dependency.statefulset" $ctx }}
{{- end }}
