{{- define "jitsu.kafka.container" -}}
ports:
  - name: kafka
    containerPort: 9092
  - name: controller
    containerPort: 9093
env:
  - name: CLUSTER_ID
    value: {{ .Values.kafka.clusterId | quote }}
  - name: KAFKA_NODE_ID
    value: "1"
  - name: KAFKA_PROCESS_ROLES
    value: "broker,controller"
  # The LOCAL listener lets the readiness probe reach the broker without going through the Service,
  # which has no endpoints until the pod is ready.
  - name: KAFKA_LISTENERS
    value: "PLAINTEXT://:9092,CONTROLLER://:9093,LOCAL://127.0.0.1:9094"
  - name: KAFKA_ADVERTISED_LISTENERS
    value: {{ printf "PLAINTEXT://%s:9092,LOCAL://localhost:9094" (include "jitsu.dependency.name" (list . "kafka")) | quote }}
  - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
    value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,LOCAL:PLAINTEXT"
  - name: KAFKA_CONTROLLER_LISTENER_NAMES
    value: "CONTROLLER"
  - name: KAFKA_INTER_BROKER_LISTENER_NAME
    value: "PLAINTEXT"
  - name: KAFKA_CONTROLLER_QUORUM_VOTERS
    value: "1@localhost:9093"
  - name: KAFKA_LOG_DIRS
    value: "/var/lib/kafka/data"
  - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
    value: "1"
  - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
    value: "1"
  - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
    value: "1"
  - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
    value: "1"
  - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR
    value: "1"
startupProbe:
  tcpSocket:
    port: kafka
  periodSeconds: 5
  failureThreshold: 120
readinessProbe:
  exec:
    command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9094"]
  periodSeconds: 15
  timeoutSeconds: 10
livenessProbe:
  tcpSocket:
    port: kafka
{{- end }}

{{- if .Values.kafka.enabled }}
{{- $ctx := dict
  "root" .
  "name" (include "jitsu.dependency.name" (list . "kafka"))
  "component" "kafka"
  "values" .Values.kafka
  "mountPath" "/var/lib/kafka"
  "container" (include "jitsu.kafka.container" .)
  "ports" (dict "kafka" 9092)
  "podSecurityContext" (dict "fsGroup" 1000)
}}
{{ include "jitsu.dependency.service" $ctx }}
---
{{ include "jitsu.dependency.statefulset" $ctx }}
{{- end }}
