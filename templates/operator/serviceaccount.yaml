{{- if and .Values.operator.enabled .Values.operator.serviceAccount.create .Values.operator.serviceAccount.rbac.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "jitsu.operator.serviceAccountName" . }}
  labels:
    {{- include "jitsu.labels" . | nindent 4 }}
  {{- with .Values.operator.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
