{{- if and .Values.operator.enabled .Values.operator.serviceAccount.rbac.create (not .Values.operator.config.kubernetesClientConfig) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "jitsu.fullname" . }}-operator
  labels:
    {{- include "jitsu.labels" . | nindent 4 }}
  namespace: {{ .Values.operator.config.kubernetesNamespace | default .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get","list","watch","create","update","patch","delete"]
{{- end }}
