{{- if .Values.profiles.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jitsu.fullname" . }}-profiles
  labels:
    {{- include "jitsu.labels" . | nindent 4 }}
spec:
  type: {{ .Values.profiles.service.type }}
  ports:
    - port: {{ .Values.profiles.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.profiles.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "jitsu.selectorLabels" . | nindent 4 }}
    {{- include "jitsu.profiles.selectorLabels" . | nindent 4 }}
{{- end }}
