kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Let the ingress-nginx controller schedule onto this node and bind
    # the host ports mapped below.
    labels:
      ingress-ready: "true"
    # Rootless Docker: kind rewrites the node's resolv.conf to the network
    # gateway, where no resolver answers. Mount a static resolv.conf to
    # bypass Docker's embedded DNS entirely.
    extraMounts:
      - hostPath: ./kind-resolv.conf
        containerPath: /etc/resolv.conf
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
