# The operator reconciles per-workspace functions-server deployments in
# Kubernetes. Required for event delivery since Jitsu 2.14: rotor routes
# events through functions servers and drops events of connections without
# functions-server routing information.
operator:
  enabled: true
  config:
    # Set to false to disable config abstractions in order to configure manually.
    enabled: true

    # Leave empty to use global jitsu.databaseUrl
    databaseUrl: ""
    databaseUrlFrom: {}

    # Console export endpoints. Leave empty to configure automatically.
    repositoryBaseUrl: ""

    # Leave empty to configure automatically.
    repositoryAuthToken: ""
    repositoryAuthTokenFrom: {}

    # How often to poll the console for configuration changes.
    repositoryRefreshPeriodSec: ""

    # MongoDB persistent store for functions servers. When set, a mongobetween
    # proxy sidecar is added to functions-server pods. Leave empty to
    # configure automatically when the MongoDB subchart is used.
    mongodbUrl: ""
    mongodbUrlFrom: {}

    # Kubernetes access. Leave empty to use the in-cluster service account.
    kubernetesClientConfig: ""
    kubernetesClientConfigFrom: {}
    kubernetesContext: ""

    # Namespace to deploy functions servers to. Leave empty to use the
    # deployment namespace. If operator.serviceAccount.rbac.create is true and
    # operator.config.kubernetesClientConfig is unset a Role and RoleBinding
    # will be created in this namespace.
    kubernetesNamespace: ""
    kubernetesNamespaceFrom: {}

    # nodeSelector for functions-server pods; dict or JSON string.
    kubernetesNodeSelector: ""

    # Service account, tolerations, resources and topology spread constraints
    # for functions-server pods; dicts/lists or JSON strings.
    podsServiceAccount: ""
    podsTolerations: ""
    podsResources: ""
    podsResourcesPremium: ""
    podsResourcesFree: ""
    podsTopologySpreadConstraints: ""

    # Leave empty to default to jitsucom/functions-server:{{ .Values.operator.image.tag | default .Chart.AppVersion }}
    functionsServerImage: ""
    functionsServerPort: ""

    # Service type of the functions-server services.
    serviceType: ""

    # Functions class for workspaces without an explicit feature flag.
    # One of "dedicated", "free" or "premium". Workspaces without a class are
    # ignored by the operator and their events are dropped, so this defaults
    # to "free" (all workspaces share one functions-server deployment).
    defaultFunctionsClass: "free"

    # Minimum replicas of functions-server deployments. Upstream defaults to
    # 2 (4 for premium); set to 1 here for a minimal footprint.
    minReplicas: "1"
    minReplicasPremium: ""
    minReplicasFree: "1"

    # Number of shards for free tier deployments.
    freeShards: ""

    # HPA configuration for functions-server deployments.
    hpaEnabled: ""
    hpaMaxReplicas: ""
    hpaTargetCpuUtilization: ""

    # Mongobetween sidecar image.
    mongobetweenImage: ""

    # Log format. One of "text", "json".
    logFormat: "text"
  serviceAccount:
    create: true
    annotations: {}
    name: ""
    rbac:
      create: true
  replicaCount: 1
  image:
    repository: jitsucom/operator
    pullPolicy: IfNotPresent
    tag: ""
  service:
    type: ClusterIP
    port: 3052
    metricsPort: 9091
  probes:
    enabled: true
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  env: []
  envFrom: []
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: ~
  serviceMonitor:
    enabled: false
    labels: {}
    interval: ~
    relabelings:
      - action: replace
        targetLabel: service
        replacement: operator
  revisionHistoryLimit: 2
  volumes: []
  volumeMounts: []
  strategy: {}
  waitFor:
    - name: tokens
      enabled: '{{ .Values.tokenGenerator.enabled }}'
      resource: 'jobs.batch/{{ include "jitsu.fullname" . }}-token-generator-{{ include "jitsu.hash" . }}'
      for: condition=Complete=true
    - name: migration
      enabled: '{{ .Values.migration.enabled }}'
      resource: 'jobs.batch/{{ include "jitsu.fullname" . }}-migration-{{ include "jitsu.hash" . }}'
      for: condition=Complete=True
    - name: console
      enabled: '{{ .Values.console.enabled }}'
      resource: 'deployments.apps/{{ include "jitsu.fullname" . }}-console'
      for: condition=Available=true
    - name: postgresql
      enabled: '{{ .Values.postgresql.enabled }}'
      resource: 'pod/{{ .Release.Name }}-postgresql-0'
      for: condition=Ready=true
    - name: mongodb
      enabled: '{{ .Values.mongodb.enabled }}'
      resource: 'deployments.apps/{{ .Release.Name }}-mongodb'
      for: condition=Available=true

