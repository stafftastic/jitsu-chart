    authTokens: ""
    authTokensFrom: {}

    # Leave empty to automatically configure.
    # https://docs.jitsu.com/self-hosting/configuration#rotor
    tokenSecret: ""
    tokenSecretFrom: {}


    # Leave empty to configure automatically if config.redisUrl is set or Redis subchart is being used.
